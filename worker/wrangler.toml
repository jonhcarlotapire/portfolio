# Cloudflare deployment configuration. The Worker uses Web APIs, not Node.js.
name = "jct-portfolio-assistant"
main = "assistant.mjs"
compatibility_date = "2026-09-30"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://jonhcarlotapire.github.io"
OPENAI_MODEL = "gpt-4.1-mini"

# Use an unused namespace_id if 1001 is already assigned in your Cloudflare account.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Add OPENAI_API_KEY and TURNSTILE_SECRET_KEY as PRIVATE Cloudflare Worker secrets.
# Never write their values here. Do not enable nodejs_compat; it is not needed.
